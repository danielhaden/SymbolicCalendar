name: Build macOS DMG

# Push a version tag (e.g. v1.0.0) to build the app, package a DMG, and attach
# it to a GitHub Release. Manual runs build a DMG and upload it as a run
# artifact instead (handy for testing without cutting a release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/upload the release

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"          # v1.0.0 -> 1.0.0
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"        # dev build from a manual run
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - name: Build .app (PyInstaller)
        env:
          CALENDAR_VERSION: ${{ env.VERSION }}
        run: pyinstaller --noconfirm --clean Calendar.spec

      - name: Smoke test (moon data computes inside the bundle)
        run: dist/Calendar.app/Contents/MacOS/Calendar --selftest

      - name: Package DMG
        run: |
          STAGE="$(mktemp -d)"
          cp -R dist/Calendar.app "$STAGE/Calendar.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Calendar -srcfolder "$STAGE" \
            -ov -format UDZO "Calendar-${VERSION}-arm64.dmg"
          rm -rf "$STAGE"

      - name: Attach DMG to the release (tag pushes)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Calendar-*.dmg
          fail_on_unmatched_files: true

      - name: Upload DMG as a build artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Calendar-${{ env.VERSION }}-arm64-dmg
          path: Calendar-*.dmg
